{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3>ML Algorithms Inference Demo</h3>
            </div>
            <div class="card-body">
                <form id="prediction-form">
                    <div class="mb-3">
                        <label for="model" class="form-label">Select Model</label>
                        <select class="form-select" id="model" name="model" required>
                            <option value="naive_bayes">Naive Bayes</option>
                            <option value="knn">KNN</option>
                            <option value="decision_tree">Decision Tree</option>
                            <option value="adaboost">AdaBoost</option>
                            <option value="kmeans">KMeans</option>
                            <option value="pca">PCA</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="sepal_length" class="form-label">Sepal Length (cm)</label>
                        <input type="number" step="any" class="form-control" id="sepal_length" name="sepal_length" required>
                    </div>
                    <div class="mb-3">
                        <label for="sepal_width" class="form-label">Sepal Width (cm)</label>
                        <input type="number" step="any" class="form-control" id="sepal_width" name="sepal_width" required>
                    </div>
                    <div class="mb-3">
                        <label for="petal_length" class="form-label">Petal Length (cm)</label>
                        <input type="number" step="any" class="form-control" id="petal_length" name="petal_length" required>
                    </div>
                    <div class="mb-3">
                        <label for="petal_width" class="form-label">Petal Width (cm)</label>
                        <input type="number" step="any" class="form-control" id="petal_width" name="petal_width" required>
                    </div>
                    <button type="submit" class="btn btn-success">Predict</button>
                </form>
                <div id="result" class="mt-4" style="display: none;">
                    <h4>Prediction Result:</h4>
                    <div id="result-content"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('prediction-form');
    const resultDiv = document.getElementById('result');
    const resultContent = document.getElementById('result-content');

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(form);
        const data = {};
        formData.forEach((value, key) => {
            data[key] = value;
        });

        fetch('/predict', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(json => {
            resultDiv.style.display = 'block';
            if (json.success) {
                if (json.prediction !== undefined) {
                    resultContent.innerHTML = `<strong>Prediction:</strong> ${json.prediction}<br>`;
                    if (json.probabilities) {
                        resultContent.innerHTML += `<strong>Probabilities:</strong> ${JSON.stringify(json.probabilities)}`;
                    }
                } else if (json.result) {
                    resultContent.innerHTML = `<strong>Transformed Data:</strong> ${JSON.stringify(json.result)}`;
                } else {
                    resultContent.innerHTML = `<strong>Message:</strong> ${json.message}`;
                }
            } else {
                resultContent.innerHTML = `<span class="text-danger">Error: ${json.message}</span>`;
            }
        })
        .catch(err => {
            resultDiv.style.display = 'block';
            resultContent.innerHTML = `<span class="text-danger">Error: ${err}</span>`;
        });
    });
});
</script>
{% endblock %}
